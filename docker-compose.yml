name: jobhunter

services:
  # Port 5433 so it runs next to Mail Template Hub's database on 5432.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jh
      POSTGRES_PASSWORD: jh_dev_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jh -d jobhunter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
